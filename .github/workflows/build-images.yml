name: Manual Build Tokyolife Inventory

env:
  # CHECKOUT_PATH: ~ ${{ github.workspace }}
  REGSRV: dcsrv02.datcom.vn:5000
  SERVICE_NAME: "tl-inventory"
  SERVER_NAME: "dcsrv02"
  
on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

jobs:
  build-on-dcsrv02:
    runs-on: dcsrv02  # Chạy trên runner local trên srv dcsrv01/sdsrv01
    # permissions:
    #   contents: write # Chỉ cấp quyền ghi cho duy nhất Job này

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # lấy các tag cũ
          
      - name: Generate version based on datetime
        run: |
          # Lấy timestamp theo định dạng vYYMMDDHH
          VERSION=v$(TZ=Asia/Ho_Chi_Minh date +%y%m%d%H)
          echo "Generated version: $VERSION"
          echo "TOKYOLIFE_VERSION=$VERSION" >> $GITHUB_ENV
          IMAGE_TAG="${{ env.REGSRV }}/${{ env.SERVICE_NAME }}:${{ env.TOKYOLIFE_VERSION }}"
          echo "FULL_IMAGE_NAME=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Build Docker Image for Dev
        run: |
          cd ${{ github.workspace }}
          # docker build -f Dockerfile -t ${{ env.FULL_IMAGE_NAME }} .
          echo "Built image ${{ env.FULL_IMAGE_NAME }}"
      - name: Push Dev image to Local Registry
        run: |
          docker push ${{ env.FULL_IMAGE_NAME }}
          echo "Pushed image ${{ env.FULL_IMAGE_NAME }} to local registry"
      - name: Remove Local Dev image
        run: docker rmi ${{ env.FULL_IMAGE_NAME }}
      
      # - name: Create and Push Tag
      #   run: |
      #     git config user.name "github-actions-dcsrv02"
      #     git config user.email "buitienlap@gmail.com"
      #     TAG_NAME="dev-${{ env.TOKYOLIFE_VERSION }}"
      #     git tag $TAG_NAME
      #     git push origin $TAG_NAME
          


      - name: Register to Dashboard
        run: |
          curl -X POST -H "Authorization: token ${{ secrets.REPO_PAT }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/datcomlab/x-build/dispatches \
          -d '{"event_type": "register_version", "client_payload": {"action": "register_version", "service": "${{ env.SERVICE_NAME }}", "version": "${{ env.TOKYOLIFE_VERSION }}", "server_name": "${{ env.SERVER_NAME }}"}}'
         
      - name: Trigger Deploy Workflow for Dev
        uses: benc-uk/workflow-dispatch@v1.2.3 # search in marketplace
        with:
          workflow: deploy-image.yml
          token: ${{ secrets.REPO_PAT }}
          ref: main
          inputs: |
            {
              "version": "${{ env.TOKYOLIFE_VERSION }}",
              "image_name": "${{ env.SERVICE_NAME }}",
              "site_name": "uat"
            }

            
