name: Deploy Tokyolife Inventory on dcsrv02

env:
  COMPOSE_PATH: /opt/jobhula/project/tokyolife/inventory
  REGSRV: dcsrv02.datcom.vn:5000
  
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version của image mới (ví dụ: v25081908).'
        required: false
      deploy_type:
        description: 'Cập nhật source hoặc cả image'
        required: true
        type: choice
        options:
          - sync
          - image
        default: 'sync'
      site_name:
        description: 'Deploy cho site'
        required: true
        type: choice
        options:
          - uat
        default: 'uat'

jobs:
  sync-source-uat:
    if: ${{ inputs.deploy_type == 'sync' && inputs.site_name == 'uat' }}
    runs-on: dcsrv02  # Chạy trên runner local trên srv dcsrv01/sdsrv01/sdsrv02

    steps:
      - name: Checkout code
        uses: actions/checkout@refs/heads/main  # Pull từ (@refs/heads/main OR @refs/tags/ver) về folder _work

      - name: Sync source site uat
        run: |
          rsync -razv --exclude={'.git','.github','_pycache__','.env','.env.example'} ${{ github.workspace }}/ ${{ env.COMPOSE_PATH }}/src/
          # restart container
          cd ${{ env.COMPOSE_PATH }}/
          docker-compose -f docker-compose.yml down
          docker-compose -f docker-compose.yml up -d

          echo "Containers after deployment:"
          docker-compose logs


          
