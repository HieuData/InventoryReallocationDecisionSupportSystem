version: '3.8'

services:
  web:
    build: .
    container_name: inventory_optimization
    ports:
      - "5000:5000"
    volumes:
      # Mount uploaded files for persistence
      - ./uploads:/app/uploads
      # Mount session data for persistence
      - ./flask_session:/app/flask_session
      # Mount output folder for optimization results
      - ./output:/app/output
    environment:
      - FLASK_APP=app.py
      - PYTHONUNBUFFERED=1
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-change-this-secret-key-in-production}
    restart: unless-stopped
