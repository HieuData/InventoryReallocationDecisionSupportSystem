<section class="section-product">
    <h2>📦 Tổng quan Sản phẩm</h2>

    <div class="tables-row single-col">
        <div class="table-container">
            <h3>Sản phầm trên Hệ thống</h3>

            <!-- Layer Tabs (matching Store Profiles style) -->
            <div class="layer-tabs">
                <button class="layer-btn active" data-layer="ma-hang">Mã hàng</button>
                <button class="layer-btn" data-layer="skc">SKC</button>
                <button class="layer-btn" data-layer="sku">SKU</button>
            </div>

            <!-- Layer Content -->
                <!-- Mã hàng Layer -->
                <div id="layer-ma-hang" class="layer-pane active">
                    <!-- Filter Section -->
                    <div class="filter-section" style="margin: 15px 0; padding: 10px; background: #f5f5f5; border-radius: 5px;">
                        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;">
                            <div>
                                <label for="filter-location-ma-hang" style="font-weight: bold; display: block; margin-bottom: 5px;">Vị trí:</label>
                                <select id="filter-location-ma-hang" class="filter-select" style="width: 100%; padding: 5px;">
                                    <option value="all">Tất cả</option>
                                </select>
                            </div>
                            <div>
                                <label for="filter-ma-hang-ma-hang" style="font-weight: bold; display: block; margin-bottom: 5px;">Mã hàng:</label>
                                <select id="filter-ma-hang-ma-hang" class="filter-select" style="width: 100%; padding: 5px;">
                                    <option value="all">Tất cả</option>
                                </select>
                            </div>
                            <div>
                                <label for="filter-moh-ma-hang" style="font-weight: bold; display: block; margin-bottom: 5px;">MOH:</label>
                                <select id="filter-moh-ma-hang" class="filter-select" style="width: 100%; padding: 5px;">
                                    <option value="all">Tất cả</option>
                                    <option value="0-1.5">0 - 1.5</option>
                                    <option value="1.5-2.5">1.5 - 2.5</option>
                                    <option value="2.5-3.6">2.5 - 3.6</option>
                                    <option value="3.6-max">3.6 - Max</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Mã hàng Table -->
                    <table id="table-product-ma-hang" class="display"></table>
                </div>


                <!-- SKC Layer -->
                <div id="layer-skc" class="layer-pane">
                    <!-- Filter Section -->
                    <div class="filter-section" style="margin: 15px 0; padding: 10px; background: #f5f5f5; border-radius: 5px;">
                        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;">
                            <div>
                                <label for="filter-location-skc" style="font-weight: bold; display: block; margin-bottom: 5px;">Vị trí:</label>
                                <select id="filter-location-skc" class="filter-select" style="width: 100%; padding: 5px;">
                                    <option value="all">Tất cả</option>
                                </select>
                            </div>
                            <div>
                                <label for="filter-ma-hang-skc" style="font-weight: bold; display: block; margin-bottom: 5px;">Mã hàng:</label>
                                <select id="filter-ma-hang-skc" class="filter-select" style="width: 100%; padding: 5px;">
                                    <option value="all">Tất cả</option>
                                </select>
                            </div>
                            <div>
                                <label for="filter-mau-chi-tiet-skc" style="font-weight: bold; display: block; margin-bottom: 5px;">Màu chi tiết:</label>
                                <select id="filter-mau-chi-tiet-skc" class="filter-select" style="width: 100%; padding: 5px;">
                                    <option value="all">Tất cả</option>
                                </select>
                            </div>
                            <div>
                                <label for="filter-moh-skc" style="font-weight: bold; display: block; margin-bottom: 5px;">MOH:</label>
                                <select id="filter-moh-skc" class="filter-select" style="width: 100%; padding: 5px;">
                                    <option value="all">Tất cả</option>
                                    <option value="0-1.5">0 - 1.5</option>
                                    <option value="1.5-2.5">1.5 - 2.5</option>
                                    <option value="2.5-3.6">2.5 - 3.6</option>
                                    <option value="3.6-max">3.6 - Max</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- SKC Table -->
                    <table id="table-product-skc" class="display"></table>
                </div>

                <!-- SKU Layer -->
                <div id="layer-sku" class="layer-pane">
                    <!-- Filter Section -->
                    <div class="filter-section" style="margin: 15px 0; padding: 10px; background: #f5f5f5; border-radius: 5px;">
                        <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;">
                            <div>
                                <label for="filter-location-sku" style="font-weight: bold; display: block; margin-bottom: 5px;">Vị trí:</label>
                                <select id="filter-location-sku" class="filter-select" style="width: 100%; padding: 5px;">
                                    <option value="all">Tất cả</option>
                                </select>
                            </div>
                            <div>
                                <label for="filter-ma-hang-sku" style="font-weight: bold; display: block; margin-bottom: 5px;">Mã hàng:</label>
                                <select id="filter-ma-hang-sku" class="filter-select" style="width: 100%; padding: 5px;">
                                    <option value="all">Tất cả</option>
                                </select>
                            </div>
                            <div>
                                <label for="filter-mau-chi-tiet-sku" style="font-weight: bold; display: block; margin-bottom: 5px;">Màu chi tiết:</label>
                                <select id="filter-mau-chi-tiet-sku" class="filter-select" style="width: 100%; padding: 5px;">
                                    <option value="all">Tất cả</option>
                                </select>
                            </div>
                            <div>
                                <label for="filter-size-sku" style="font-weight: bold; display: block; margin-bottom: 5px;">Size:</label>
                                <select id="filter-size-sku" class="filter-select" style="width: 100%; padding: 5px;">
                                    <option value="all">Tất cả</option>
                                </select>
                            </div>
                            <div>
                                <label for="filter-moh-sku" style="font-weight: bold; display: block; margin-bottom: 5px;">MOH:</label>
                                <select id="filter-moh-sku" class="filter-select" style="width: 100%; padding: 5px;">
                                    <option value="all">Tất cả</option>
                                    <option value="0-1.5">0 - 1.5</option>
                                    <option value="1.5-2.5">1.5 - 2.5</option>
                                    <option value="2.5-3.6">2.5 - 3.6</option>
                                    <option value="3.6-max">3.6 - Max</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Export Button -->
                    <!-- <div style="margin: 10px 0; text-align: right;">
                        <button id="btn-export-sku-csv" class="btn-primary" style="padding: 8px 16px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer;">
                            📥 Export CSV
                        </button>
                    </div> -->

                    <!-- SKU Table -->
                    <table id="table-product-sku" class="display"></table>
                </div>
            </div>
        </div>
    </div>
</section>
