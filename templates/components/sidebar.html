<aside class="sidebar">
    <h2>⚙️ Configuration</h2>
    
    <div class="config-section">
        <h3>Input Files</h3>
        <label>Store Files:</label>
        <input type="file" id="store-files" multiple accept=".csv">
        
        <label>Warehouse Files:</label>
        <input type="file" id="warehouse-files" multiple accept=".csv">
    </div>
    
    <div class="config-section">
        <h3>Parameters</h3>
        <label>Time Limit (s):</label>
        <input type="number" id="time-limit" value="300" min="10">
        
        <label>Optimality Gap:</label>
        <input type="number" id="gap" value="0.05" step="0.01" min="0" max="1">
        
        <label>Season:</label>
        <select id="season">
            <option value="false">Season has not come</option>
            <option value="true">Season has come</option>
        </select>
    </div>

    <div class="config-section">
        <h3>Category Filter</h3>
        <label>Category:</label>
        <select id="category-filter-overview">
            <option value="Giày dép">Giày dép</option>
            <option value="Quần áo">Quần áo</option>
            <option value="Phụ kiện">Phụ kiện</option>
        </select>
    </div>

    <div class="config-section">
        <h3>Data Status</h3>
        <div id="data-status">
            <span class="status-dot red"></span> No data loaded
        </div>
        <button id="btn-clear-data" class="btn btn-danger" style="margin-top: 10px; width: 100%;">
            🗑️ Clear All Data
        </button>
    </div>
</aside>
