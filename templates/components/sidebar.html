<aside class="sidebar">
    <h2>⚙️ Tùy chỉnh</h2>
    
    <div class="config-section">
        <h3>Dữ liệu đầu vào</h3>
        <label>Dữ liệu cửa hàng:</label>
        <input type="file" id="store-files" multiple accept=".csv">
        
        <label>Dữ liệu kho:</label>
        <input type="file" id="warehouse-files" multiple accept=".csv">
    </div>
    
    <div class="config-section">
        <h3>Tham số</h3>
        <label>Thời gian giới hạn khi chạy mô hình (s):</label>
        <input type="number" id="time-limit" value="300" min="10">
        
        <label>Chênh lệch giữa kết quả và giá trị tối ưu toàn cục:</label>
        <input type="number" id="gap" value="0.05" step="0.01" min="0" max="1">
        
        <label>Mùa:</label>
        <select id="season">
            <option value="false">Chưa vào mùa</option>
            <option value="true">Đã vào mùa</option>
        </select>
    </div>

    <div class="config-section">
        <h3>Lọc theo Phân loại</h3>
        <label>Phân loại:</label>
        <select id="category-filter-overview">
            <option value="Giày dép">Giày dép</option>
            <option value="Quần áo">Quần áo</option>
            <option value="Phụ kiện">Phụ kiện</option>
        </select>
    </div>

    <div class="config-section">
        <h3>Trạng thái dữ liệu</h3>
        <div id="data-status">
            <span class="status-dot red"></span> Chưa có dữ liệu
        </div>
        <button id="btn-clear-data" class="btn btn-danger" style="margin-top: 10px; width: 100%;">
            🗑️ Xóa tất cả dữ liệu
        </button>
    </div>
</aside>
